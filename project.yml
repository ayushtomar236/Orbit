name: Orbit
options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    SWIFT_VERSION: "5.0"
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: OrbitApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app
        INFOPLIST_FILE: OrbitApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
    dependencies:
      - package: supabase-swift
        product: Supabase
    scheme:
      testTargets: []
